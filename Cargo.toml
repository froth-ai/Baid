[workspace]
resolver = "2"
# Layers (code-architecture.md section 1); a crate depends only on lower layers:
#   binaries:        gc-server, memharness
#   orchestration:   gc-exec, gc-mcp
#   building blocks: gc-cache, gc-session, gc-predict, gc-pack, gc-invalidate,
#                    gc-adapters, gc-telemetry
#   foundation:      gc-core (depends on no other gc crate)
members = [
    "crates/gc-core",
    "crates/gc-cache",
    "crates/gc-session",
    "crates/gc-predict",
    "crates/gc-pack",
    "crates/gc-invalidate",
    "crates/gc-adapters",
    "crates/gc-telemetry",
    "crates/gc-exec",
    "crates/gc-mcp",
    "crates/gc-server",
    "crates/memharness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# Highest MSRV among the planned dependencies (foyer 0.22 needs 1.91).
rust-version = "1.91"
publish = false

[workspace.dependencies]
# Internal crates
gc-core = { path = "crates/gc-core" }
gc-cache = { path = "crates/gc-cache" }
gc-session = { path = "crates/gc-session" }
gc-predict = { path = "crates/gc-predict" }
gc-pack = { path = "crates/gc-pack" }
gc-invalidate = { path = "crates/gc-invalidate" }
gc-adapters = { path = "crates/gc-adapters" }
gc-telemetry = { path = "crates/gc-telemetry" }
gc-exec = { path = "crates/gc-exec" }
gc-mcp = { path = "crates/gc-mcp" }

# External crates from the dependency table in code-architecture.md section 1.
# Latest stable releases on crates.io as of 2026-11-14. Crates enable features
# where they use them.
ahash = "0.8.12"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = "4.6.7"
dashmap = "6.2.1"
figment = "0.10.19"
foyer = "0.22.6"
futures = "0.3.34"
hdrhistogram = "7.6.0"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
neo4rs = "0.8.0"
object_store = "0.14.2"
opentelemetry-otlp = "0.33.1"
postcard = "1.1.3"
reqwest = { version = "0.13.5", default-features = false }
rmcp = "3.10.0"
rustls = "0.23.46"
serde = "1.0.229"
serde_json = "1.0.154"
smallvec = "1.16.5"
thiserror = "2.0.21"
tiktoken-rs = "0.12.1"
tokio = "1.54.1"
tokio-util = "0.7.20"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.26"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
unwrap_used = "warn"
